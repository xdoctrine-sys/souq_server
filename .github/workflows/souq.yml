name: SOUQ Testing

on:
  merge_group:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  souq:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 3s
          --health-retries 50
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s
          --health-timeout 3s
          --health-retries 50
        ports:
          - 6379:6379

    env:
      RAILS_ENV: test
      BUNDLE_WITH: test
      BUNDLE_CLEAN: true
      BUNDLE_FROZEN: true
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: souq_contract_test

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Check upstream touchpoints
        run: engines/souq/bin/souq-check-touchpoints

      - name: Set up Ruby environment
        uses: ./.github/actions/setup-ruby

      - name: Prepare contract database
        run: bin/rails db:create db:schema:load

      - name: Run SOUQ contracts without commit proof
        run: bin/rspec spec/souq

      - name: Prepare dedicated commit proof database
        env:
          DB_NAME: souq_commit_proof_test
        run: bin/rails db:create db:schema:load

      - name: Run real commit proof in a separate process
        env:
          DB_NAME: souq_commit_proof_test
          SOUQ_COMMIT_PROOF: '1'
        run: bin/rspec spec/souq/proof --order defined
